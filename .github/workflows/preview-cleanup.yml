name: Preview Cleanup

# Deletes every Cloudflare Pages deployment preview.yml made for a PR once it
# closes, so its `pr-<number>` URL stops serving.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

# Shares preview.yml's group, so closing a PR cancels a preview still
# deploying, which would otherwise outlive the cleanup.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    name: Delete preview
    runs-on: ubuntu-latest
    # A fork PR never got a preview to delete.
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Delete preview deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          project=$(sed -n 's/^ *"name": *"\([^"]*\)".*/\1/p' wrangler.jsonc)
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$project/deployments"
          # `wrangler pages deployment list` reads only the first page, so page
          # through the API, collecting every ID before deleting any so the
          # pages don't shift underneath.
          ids=()
          for ((page = 1; ; page++)); do
            result=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$api?env=preview&per_page=25&page=$page")
            mapfile -t -O "${#ids[@]}" ids < <(jq -r --arg branch "pr-$PR_NUMBER" \
              '.result[] | select(.deployment_trigger.metadata.branch == $branch) | .id' <<< "$result")
            [ "$(jq '.result | length' <<< "$result")" -lt 25 ] && break
          done
          if [ "${#ids[@]}" -eq 0 ]; then
            echo "No deployments on pr-$PR_NUMBER to delete."
            exit 0
          fi
          for id in "${ids[@]}"; do
            # `force` deletes the deployment the branch alias points at too.
            curl -fsS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$api/$id?force=true" > /dev/null
            echo "Deleted deployment $id"
          done
